<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>자동 연결 WebRTC 화면 공유 & 제어</title>
    <style>
        body { font-family: sans-serif; margin: 20px; background: #f4f4f9; }
        .setup-box { background: #fff; padding: 15px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .container { display: flex; gap: 20px; }
        .box { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); flex: 1; position: relative; }
        video { width: 100%; background: #000; border-radius: 4px; }
        button { padding: 8px 15px; cursor: pointer; }
        .toggle-box { background: #e0f7fa; padding: 10px; margin-top: 10px; border-radius: 4px; }
        #remoteCursor { position: absolute; display: none; width: 12px; height: 12px; background: red; border: 2px solid white; border-radius: 50%; pointer-events: none; transform: translate(-50%, -50%); z-index: 10; }
    </style>
    <!-- Socket.io 클라이언트 라이브러리 자동 로드 -->
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>

    <h2>자동 연결 WebRTC P2P 화면 공유 + 권한 제어</h2>

    <!-- 방 참여 설정 영역 -->
    <div class="setup-box">
        <input type="text" id="roomInput" placeholder="방 번호 입력 (예: room123)">
        <button onclick="joinRoom()">방 입장 및 연결 준비</button>
        <span id="statusText" style="margin-left: 15px; font-weight: bold; color: gray;">대기 중...</span>
    </div>
    
    <div class="container">
        <!-- 내 화면 영역 -->
        <div class="box">
            <h3>내 화면 (송출)</h3>
            <video id="localVideo" autoplay muted playsinline></video>
            <div style="margin-top: 10px;">
                <button onclick="startShare()">화면 공유 시작</button>
            </div>
            <div class="toggle-box">
                <label>
                    <input type="checkbox" id="controlToggle" onchange="toggleControl(this)"> 
                    상대방의 마우스 제어 허용 (ON/OFF)
                </label>
            </div>
        </div>

        <!-- 상대방 화면 영역 -->
        <div class="box" id="remoteContainer">
            <h3>상대방 화면 (수신)</h3>
            <video id="remoteVideo" autoplay playsinline></video>
            <!-- 상대방 화면 위에 표시될 가상 마우스 포인터 -->
            <div id="remoteCursor"></div>
        </div>
    </div>

    <script>
        const socket = io();
        let localStream;
        let pc;
        let dataChannel;
        let isControlAllowed = false;
        let currentRoom = '';

        const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

        // 1. 방 입장하기
        function joinRoom() {
            const room = document.getElementById('roomInput').value.trim();
            if (!room) {
                alert('방 번호를 입력해주세요!');
                return;
            }
            currentRoom = room;
            socket.emit('join-room', room);
            document.getElementById('statusText').innerText = `방 [${room}] 접속 완료. 상대방을 기다리는 중...`;
            document.getElementById('statusText').style.color = 'orange';
        }

        // 2. 화면 공유 시작 및 WebRTC 초기화
        async function startShare() {
            try {
                localStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: false });
                document.getElementById('localVideo').srcObject = localStream;

                createPeerConnection();

                // 내 스트림 트랙을 피어 커넥션에 추가
                localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

                // 송출자가 데이터 채널(Control Channel) 생성
                dataChannel = pc.createDataChannel("controlChannel");
                setupDataChannel();

                // Offer 생성 및 전송
                const offer = await pc.createOffer();
                await pc.setLocalDescription(offer);
                socket.emit('offer', { room: currentRoom, offer: pc.localDescription });

                document.getElementById('statusText').innerText = '화면 공유 및 연결 시도 중...';
            } catch (err) {
                alert("화면 공유를 시작할 수 없습니다: " + err.message);
            }
        }

        // 3. WebRTC 피어 커넥션 객체 생성 공통 함수
        function createPeerConnection() {
            if (pc) return;
            pc = new RTCPeerConnection(rtcConfig);

            // 상대방의 스트림을 받을 때
            pc.ontrack = (event) => {
                document.getElementById('remoteVideo').srcObject = event.streams[0];
                document.getElementById('statusText').innerText = 'P2P 연결 성공! 화면 공유 중';
                document.getElementById('statusText').style.color = 'green';
            };

            // 수신자가 데이터 채널을 받을 때
            pc.ondatachannel = (event) => {
                dataChannel = event.channel;
                setupDataChannel();
            };

            // ICE 후보 수집 시 서버를 통해 상대방에게 전달
            pc.onicecandidate = (event) => {
                if (event.candidate) {
                    socket.emit('ice-candidate', { room: currentRoom, candidate: event.candidate });
                }
            };
        }

        // --- Socket.io 시그널링 이벤트 핸들러 ---
        socket.on('peer-joined', async (id) => {
            document.getElementById('statusText').innerText = '상대방이 입장했습니다. 화면 공유를 시작하세요.';
            document.getElementById('statusText').style.color = 'blue';
        });

        socket.on('offer', async (offer) => {
            createPeerConnection();
            await pc.setRemoteDescription(new RTCSessionDescription(offer));
            
            const answer = await pc.createAnswer();
            await pc.setLocalDescription(answer);
            socket.emit('answer', { room: currentRoom, answer: pc.localDescription });
        });

        socket.on('answer', async (answer) => {
            await pc.setRemoteDescription(new RTCSessionDescription(answer));
        });

        socket.on('ice-candidate', async (candidate) => {
            if (pc) {
                await pc.addIceCandidate(new RTCIceCandidate(candidate));
            }
        });

        // 4. DataChannel 이벤트 설정 (마우스 좌표 송수신)
        function setupDataChannel() {
            dataChannel.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data.type === 'mouseMove' && isControlAllowed) {
                    const cursor = document.getElementById('remoteCursor');
                    cursor.style.display = 'block';
                    cursor.style.left = data.x + 'px';
                    cursor.style.top = data.y + 'px';
                }
            };
        }

        // 5. 권한 토글 스위치 조작
        function toggleControl(checkbox) {
            isControlAllowed = checkbox.checked;
        }

        // 상대방 화면 영역 위에서 마우스가 움직일 때 좌표 전송
        const remoteVideoEl = document.getElementById('remoteVideo');
        remoteVideoEl.addEventListener('mousemove', (e) => {
            if (dataChannel && dataChannel.readyState === 'open') {
                const rect = e.target.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                
                dataChannel.send(JSON.stringify({ type: 'mouseMove', x, y }));
            }
        });
    </script>
</body>
</html>

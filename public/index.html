<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>자동 연결 WebRTC 화면 공유 & 제어</title>
    <!-- CSS 파일 링크 -->
    <link rel="stylesheet" href="/css/style.css">
    <!-- Socket.io 클라이언트 라이브러리 자동 로드 -->
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>

    <h2>자동 연결 WebRTC P2P 화면 공유 + 권한 제어</h2>

    <!-- 방 참여 설정 영역 -->
    <div class="setup-box">
        <input type="text" id="roomInput" placeholder="방 번호 입력 (예: room123)">
        <button onclick="joinRoom()">방 입장 및 연결 준비</button>
        <span id="statusText" style="margin-left: 15px; font-weight: bold; color: gray;">대기 중...</span>
    </div>
    
    <div class="container">
        <!-- 내 화면 영역 (송출 + 들어온 사용자의 마우스 시각화 오버레이 포함) -->
        <div class="box">
            <h3>내 화면 (송출)</h3>
            <div id="localVideoContainer">
                <video id="localVideo" autoplay muted playsinline></video>
                <!-- 들어온 사용자 마우스를 그릴 오버레이 -->
                <div id="visitorMouseOverlay">
                    <div id="remoteCursorOnLocal" class="visitor-pointer"></div>
                </div>
            </div>
            <div style="margin-top: 10px;">
                <button onclick="startShare()">화면 공유 시작</button>
            </div>
            <div class="toggle-box">
                <label>
                    <input type="checkbox" id="controlToggle" onchange="toggleControl(this)"> 
                    상대방의 마우스 시각화 (ON/OFF)
                </label>
            </div>
        </div>

        <!-- 상대방 화면 영역 (수신) -->
        <div class="box" id="remoteContainer">
            <h3>상대방 화면 (수신)</h3>
            <video id="remoteVideo" autoplay playsinline></video>
            <!-- 상대방 화면 위에 표시될 가상 마우스 포인터 -->
            <div id="remoteCursor"></div>
        </div>
    </div>

    <!-- JS 파일 링크 -->
    <script src="/js/main.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>공동 웹 브라우저 제어</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>

    <h2>공유 웹 브라우저 (실시간 제어)</h2>

    <div class="setup-box">
        <input type="text" id="urlInput" placeholder="이동할 URL 입력 (예: https://naver.com)" style="width: 300px;">
        <button onclick="changeUrl()">이동</button>
    </div>
    
    <div class="container">
        <div class="box" style="position: relative;">
            <h3>브라우저 화면</h3>
            <!-- 서버 브라우저 화면이 이미지로 갱신됨 -->
            <img id="browserScreen" style="width: 100%; cursor: pointer; border: 1px solid #ccc;" alt="브라우저 화면 로딩중...">
        </div>
    </div>

    <script src="/js/main.js"></script>
</body>
</html>
